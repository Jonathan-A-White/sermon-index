# Bible Thinker (https://biblethinker.org), Mike Winger's site: his book series
# through the Bible and his other teachings that name a passage, one row a post,
# written by
#
#   go run ./tools/biblethinker --cache .biblethinker-cache --out sources/biblethinker --report sources/biblethinker/REPORT.md
#
# from the archive pages of the categories the tool reads (https://biblethinker.org/1-peter/,
# /hebrews/, /mark/, /romans/, /how-to-find-jesus-in-the-old-testament/,
# /wisdom-in-the-word/, /understanding-the-old-testament-law/,
# /past-livestreams-and-misc-topical-teachings/ and their later pages) and, for
# the dates, the WordPress REST API's id and date of each category's posts. A
# post whose title and address print no passage is read for one in its own
# text (its page, the Lesson Overview). This file is by hand; rows.jsonl and
# REPORT.md are rewritten by every run, so edit the tool, not them.
#
# The Governor's scope words, the newest first and the one that rules:
#
# Postern general 2026-11-24 ~23:40Z (txid
# direct:0f79878bd2671f15431dd39dc1ba151415e0240fd3f56d0d6adb277f6133347d, and
# direct:88c6674c... "genuine sermons"): "Mike Winger have other sermons that
# are on Bible thinker but are not a part of his Through the Bible series but
# they're genuine Sons if so can we link them into". So every Bible Thinker
# post whose page names a passage is a row (the Mayor's reading of those words,
# told to the Governor in that thread, direct:d1ce451b...; he may narrow it);
# the categories read are how-to-find-jesus-in-the-old-testament,
# wisdom-in-the-word, understanding-the-old-testament-law and
# past-livestreams-and-misc-topical-teachings, beside the four book series. Not
# read: past-qa-sessions, debates, interviews, thinking-biblically-reviews,
# worship-songs and christians-react-to-20-atheist-arguments-against-god (Q&A,
# debates, interviews, reactions and reviews, worship songs). A post the site
# also files under one of those is left out (REPORT.md names it).
#
# Postern general 2026-11-23, dictated: "Do Bible
# thinker should just be sermons in his book but book series though the Bible".
# That limited the source to the four book series; the 2026-11-24 words above
# widen it.
#
# What the tool counted (REPORT.md names every skipped post):
#   8 categories, 4 book series and 4 topical, 421 posts on their pages (9 of
#   them in two categories, so one row), 177 rows, 235 skipped (221 with no
#   passage in the title, the post's address or the post's text; 14 also filed
#   under a category not read).
#
# The site has NO terms of use: /terms, /terms-of-use, /terms-and-conditions,
# /legal, /privacy-policy and /copyright all answer 404 (read 2026-11-23). Its
# only legal page, /disclaimer, is a privacy policy. The words below are what
# the site does say, quoted word for word from the pages read on 2026-11-23.

id = "biblethinker"
name = "Bible Thinker: Mike Winger's teachings"
kind = "sermons"

licence = """
The site has no terms of use. Its only legal page, https://biblethinker.org/disclaimer/, is a privacy policy; it opens: "BibleThinker.org provides powerful tools for the studying of God’s Word through our free online video reference library, with study tools that are grounded in the historical, conservative Christian faith." It says nothing about copying, scraping, automated access, linking or indexing. The footer prints: "Copyright © 2026 BibleThinker. All Rights Reserved."
https://biblethinker.org/robots.txt, read 2026-11-23:
# START YOAST BLOCK
# ---------------------------
User-agent: *
Disallow:

Sitemap: https://biblethinker.org/sitemap_index.xml
# ---------------------------
# END YOAST BLOCK"""

licence_note = """
Decision: the site has no terms of use and its robots.txt forbids nothing, so the terms are NOT ADDRESSED (silence is not a permission); the Governor gave his word on 2026-11-23 17:37:46Z (Postern txid direct:cbd35263b1ee4f0d463e475a928c110f09e551f0493cbc44081935fd559c5dcf): "A: Go ahead: robots.txt allows it, no terms say no; we keep only links, titles, passages and YouTube ids". The index keeps only a post's title, its passage, its address, the id of the YouTube video the post itself embeds, and the date and length the listing prints (a post whose title and address print no passage has its page's own text read for one, and none of the text is kept); never the media, the audio (Castos), a transcript, the lesson notes or a description. The tool fetches one request at a time, two seconds apart, with a User-Agent that names the project, and obeys robots.txt. If Bible Thinker asks for the rows to be removed, the Governor removes them. Off by default, as every source whose terms are not addressed.
The videos are YouTube's: a row's alt_url is the watch address of the video the post embeds, so the player reads it as it reads a Brookfield First row; YouTube's terms bind the videos the links open, not these rows. No YouTube API is called, so the 30-day limit on API data (sources/brookfield-first) does not apply."""

credit = "Mike Winger, Bible Thinker (biblethinker.org)"
# Not the site root (internal/sources/homepage_test.go): the largest of the book series.
homepage = "https://biblethinker.org/mark/"
terms_url = "https://biblethinker.org/disclaimer/"
added = 2026-11-23
on_by_default = false

# The site answers 404 to an address it does not have; a pause keeps a
# `sermons check --urls` run polite.
[host_rules."biblethinker.org"]
delay_ms = 2000
