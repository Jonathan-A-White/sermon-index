licence_note = """
The words are public domain: David Clarkson died in 1686 and the edition used \
was printed in 1864-65, before 1929. The Archive states no licence on any of \
the three items; its terms (above) ask that use be noninfringing, and neither \
allow nor forbid automated download in so many words. The index keeps only a \
title, a reference, a page number and the address of a reader page, never a \
sentence of a sermon or of the Archive's OCR, and /v1/text does not serve the \
words of these sermons. The Banner of Truth's reprint and the Logos edition \
are licensed and are not used."""

credit = "David Clarkson; Internet Archive (scans of the 1864-65 Nichol edition, from the University of Toronto and Princeton Theological Seminary libraries)"
homepage = "https://archive.org/details/practicalworksof01clar"
terms_url = "https://archive.org/about/terms.php"
added = 2026-11-25
on_by_default = true

[host_rules."archive.org"]
delay_ms = 1000
