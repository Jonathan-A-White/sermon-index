# John Wesley's sermons in the Governor's Logos library, 164 rows: Sermons on
# Several Occasions (resource 36.0.11, 141 sermons) and, from The Works of John
# Wesley, Volumes 5, 6 and 7 (WORKSWESLEY05, 06, 07: 140 entries) the 23 that
# are not the same sermon, made by
#
#   go run ./tools/logos-import --in <vault>/plans/sermons-2026-11-05/sermons-on-several-occasions-sermons.jsonl --in <vault>/plans/sermons-2026-11-05/the-works-of-john-wesley-volume-5-sermons.jsonl --in <vault>/plans/sermons-2026-11-05/the-works-of-john-wesley-volume-6-sermons.jsonl --in <vault>/plans/sermons-2026-11-05/the-works-of-john-wesley-volume-7-sermons.jsonl --dedupe-titles --id wesley-logos --out sources/wesley-logos
#
# from the index file the Mayor made of each book on 2026-11-06 (the parser's
# book-archive form). The index keeps facts only: a title, the passage, the cited
# passages and the ref.ly address. No sentence of a sermon, and no Logos text, is
# written anywhere.
#
# --dedupe-titles: a Works entry whose title, lower case with its Roman numeral or
# "Sermon N" taken off and its marks ignored, is a title of Sermons on Several
# Occasions is dropped as a repeat: 117 of the 140 (22 of 39 in Volume 5, 44 of 46
# in Volume 6, 51 of 55 in Volume 7). REPORT.md has the counts before and after
# and every row dropped.
#
# What the tool counted: 281 lines read, 164 rows. 137 have a preaching text (the
# `ref`) and 122 cite further passages; 27 have none (most Works entries carry
# no text the index could read: their passages are cited, none is taken to be
# the text). 17 of the 23 Works rows kept are titled only "Discourse I",
# "Discourse II" ... (all in Volume 5): kept, because no title matches; they may
# be what Sermons on Several Occasions calls "Upon Our Lord's Sermon on the
# Mount: Discourse N", which was not checked.
# The link (https://ref.ly/logosres/LLS:<resource>?off=<offset>) opens the book at
# the sermon in Logos for an owner of the book and for no one else. It is
# UNVERIFIED: no one has tapped one yet (sermons check --urls was not run on it).


id = "wesley-logos"
name = "John Wesley's sermons (his Logos library)"
kind = "sermons"

# No terms page was read or quoted: the Governor's library is his own, and the
# words below are his, given to the Mayor in the Postern general channel on
# 2026-11-06 (about 14:52Z), quoted verbatim, with his word "links" for what
# this index holds.
licence = """
index these sermons so that you can add it to your sermon index with links"""

licence_note = """
From the Governor's own Logos library at his word (2026-11-06, mw-qtu3zvz); the index keeps titles, passages and ref.ly links only; a link opens the sermon only for a Logos owner of the archive. Same footing as the Logos Atlas index (mw-zbjgn3r.9).
Faithlife's terms bind the books the links open, not these rows; no terms page was read."""

credit = "John Wesley, Sermons on Several Occasions, and The Works of John Wesley, Volumes 5, 6 and 7 (the sermons not in Sermons on Several Occasions), in Logos (Faithlife)"
homepage = "https://www.logos.com/"
# Faithlife's terms of service, named for the reader; they were not read or quoted for this source.
terms_url = "https://faithlife.com/terms"
added = 2026-11-06
on_by_default = false
