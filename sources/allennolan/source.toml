# Pastor Allen Nolan's book-by-book preaching: 116 videos of the playlists of his YouTube
# channel @allennolan that are named by a Bible book, written by
#
#   YOUTUBE_API_KEY="$(mw secrets get youtube_api_key)" go run ./tools/allennolan-youtube
#
# from YouTube's official Data API (v3): channels.list, playlists.list and
# playlistItems.list, public metadata only, with a key. This file is rewritten
# by every run; edit the tool, not the file. Nothing is downloaded: no video,
# no audio, no caption. No Subsplash or allennolan.com page was read.
#
# What the tool counted (REPORT.md lists what it could not sort):
#   33 book playlists, 241 videos found, 116 rows (each with a passage),
#   125 skipped, dates 2018-11-13 to 2025-10-22.
#
# The licence below is YouTube API Services Developer Policies, section III.E,
# "Handling YouTube Data and Content" (the page last updated 2026-11-06 UTC),
# word for word.

id = "allennolan"
name = "Pastor Allen Nolan's book-by-book preaching (YouTube)"
kind = "sermons"

licence = """
API Clients may temporarily store limited amounts of Non-Authorized Data for as long as is necessary for the purposes of the API Client but not longer than 30 calendar days. As in section (III.E.4.c) immediately above, this means that after 30 calendar days, the API Client must either delete or refresh the stored data.
Aside from the permissions and rights granted in this section, you and your API Clients have no further permissions or rights to API Data, including to temporarily stored API Data."""

licence_note = """
Read by the official YouTube Data API v3 with a Google API key (the Governor's, restricted to that API), which allows reading a channel's public metadata. The index keeps only titles, dates, the preacher's name, the passage a video's title, its playlist's title or its description names, and the YouTube watch link; never video, audio, a caption, or description text beyond a passage. YouTube's terms bind the videos the links open, not these rows.
WATCH THE 30 DAYS: the Developer Policies quoted above allow public API data to be kept for 30 calendar days and then require it to be deleted or refreshed, so this list is to be regenerated by the tool at least every 30 days. A copy that cannot be refreshed (an offline bundle) is the Governor's to decide on. The pastor's own site (allennolan.com) and the Subsplash pages it embeds were read by no tool: Subsplash's terms forbid automated reading."""

credit = "Pastor Allen Nolan; his YouTube channel @allennolan"
homepage = "https://www.youtube.com/@allennolan"
terms_url = "https://developers.google.com/youtube/terms/developer-policies"
added = 2026-11-27
on_by_default = false
