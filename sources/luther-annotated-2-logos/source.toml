licence_note = """
From the Governor's own Logos library at his word (2026-11-13, mw-qtu3zvz.117); the index keeps titles, passages and ref.ly links only; a link opens the sermon only for a Logos owner of the book. Same footing as the Logos archives (mw-qtu3zvz.27).
Faithlife's terms bind the books the links open, not these rows; no terms page was read."""

