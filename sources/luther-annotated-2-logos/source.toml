# Martin Luther's sermon in The Annotated Luther, Volume 2: Word and Faith (the one sermon the book prints), 1 row,
# found inside a book the Logos library does not type as a sermon book (mw-qtu3zvz.117; left out
# there for printing no text, indexed here by mw-qtu3zvz.130), made by
#
#   go run ./tools/logos-import --in data/logos-index/the-annotated-luther-volume-2-word-and-faith-sermons.jsonl --id luther-annotated-2-logos --out sources/luther-annotated-2-logos --note "The book's heading prints no text; its introduction names the one it was preached on (Philippians 2:5–11, the pericope for Palm Sunday), which is the row's passage."
#
# from the index file in this repository (data/logos-index), which was made by
# reading the book's table of contents through the Governor's saved Logos web session.
# The book's heading prints no text, but its introduction names Philippians 2:5–11 as the text the sermon was
# preached on, so the index line carries that ref (read by hand from the introduction, mw-qtu3zvz.130). The index keeps facts only: a title, the passage, the cited passages and
# the ref.ly address. No sentence of a sermon, and no Logos text, is written anywhere.
# The link (https://ref.ly/logosres/LLS:ANNOTLUTV2?off=<offset>) opens the book at the
# sermon in Logos for an owner of the book and for no one else. It is UNVERIFIED: no
# one has tapped one yet.
#
# Each row's `topics` (mw-qtu3zvz.198) were added by hand, short subject labels read from the
# book's own introduction to the sermon; logos-import does not write them, so re-making
# rows.jsonl with the command above must be followed by putting them back.

id = "luther-annotated-2-logos"
