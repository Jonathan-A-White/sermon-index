# John Fletcher's sermons in The Works of the Reverend John Fletcher, Volume 4, 41 rows, found inside a book the Logos library does not type as a
# sermon book (mw-qtu3zvz.117, mw-qtu3zvz.131), made by
#
#   go run ./tools/logos-import --in data/logos-index/the-works-of-the-reverend-john-fletcher-volume-4-sermons.jsonl --id fletcher-works-4-logos --out sources/fletcher-works-4-logos
#
# from the index file in this repository (data/logos-index), which was made by
# reading the book's table of contents, then each sermon section's opening paragraphs
# for the Scripture it is preached on, through the Governor's saved Logos web session: ten sermons print their text in the heading (Sermons III to XI and the sermon
# on Numbers 16), and the New Birth and the thirty Brief Outlines of Sermons print it under it. The book prints Outline VIII over "Jeremiah 17:19" and Outline XXIV over
# "Amos 6:12"; the index takes the verses they quote, Jeremiah 17:9 and Amos 4:12.
# A section with no preaching text printed is left out of the index file and named in
# its report. The index keeps facts only: a title, the passage, the cited passages and
# the ref.ly address. No sentence of a sermon, and no Logos text, is written anywhere.
# The link (https://ref.ly/logosres/LLS:WORKSFLETCH04?off=<offset>) opens the book at the
# sermon in Logos for an owner of the book and for no one else. It is UNVERIFIED: no
# one has tapped one yet.

