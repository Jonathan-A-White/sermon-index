# Brookfield First (Brookfield Assembly of God, Brookfield CT), 356 sermon
# videos of its YouTube channel @BrookfieldFirst, written by
#
#   YOUTUBE_API_KEY="$(mw secrets get youtube_api_key)" go run ./tools/brookfield-youtube
#
# from YouTube's official Data API (v3): channels.list and playlistItems.list,
# public metadata only, with a key. This file is rewritten by every run; edit
# the tool, not the file. Nothing is downloaded: no video, no audio, no caption.
#
# What the tool counted (REPORT.md lists what it could not sort):
#   527 videos seen, 356 sermons, 238 with a preacher, 343 with a passage
#   (2 of them series, matched by no passage), 225 Morning RePhil episodes
#   (in data/morning-rephil.jsonl, not here), dates 2020-03-15 to 2026-11-22.
#   344 of them carry the title, preacher and passage of the church's own list
#   (passages.tsv, merged by date; see REPORT.md).
#
# The licence below was read on 2026-11-09 at the address in terms_url
# (YouTube API Services Developer Policies, section III.E, "Handling YouTube
# Data and Content", the page last updated 2026-11-06 UTC). The same sentences,
# word for word:

id = "brookfield-first"
name = "Brookfield First's sermons (Subsplash)"
kind = "sermons"

licence = """
API Clients may temporarily store limited amounts of Non-Authorized Data for as long as is necessary for the purposes of the API Client but not longer than 30 calendar days. As in section (III.E.4.c) immediately above, this means that after 30 calendar days, the API Client must either delete or refresh the stored data.
Aside from the permissions and rights granted in this section, you and your API Clients have no further permissions or rights to API Data, including to temporarily stored API Data."""

licence_note = """
Read by the official YouTube Data API v3 with a Google API key (the Governor's, restricted to that API), which allows reading a channel's public metadata. The index keeps only titles, dates, the preacher and the passage where a video's title or description names one, and the YouTube watch link; never video, audio, a caption, or description text beyond a preacher's name and a passage. YouTube's terms bind the videos the links open, not these rows.
WATCH THE 30 DAYS: the Developer Policies quoted above allow public API data to be kept for 30 calendar days and then require it to be deleted or refreshed, so this list is to be regenerated by the tool at least every 30 days. A copy that cannot be refreshed (an offline bundle) is the Governor's to decide on. Brookfield First's own site (Subsplash) forbids automated download in its terms and was read by no tool, apart from the Governor's own signed-in account, which tools/subsplash-notes reads through his browser, one page at a time, at a polite pace and at his account's risk, on his word (docs/operations.md).
The title, preacher and passage of 344 rows come instead from the church's own list of its sermons, sources/brookfield-first/passages.tsv, matched to the videos by date: 31 typed by hand from screenshots of the church's app that the Governor took, and 65 from messages the Governor sent, each read by him in the church's app (these are sermons that have no notes). The title and passage of 111 of them are those of the sermon notes the church's app mailed the Governor (tools/subsplash-notes), written to the list by tools/subsplash-links --read-notes. The title, preacher or passage of 137 of them were read from the app through the Governor's own signed-in browser, at a polite pace, on his word and at his account's risk (tools/subsplash-notes inventory), and written to the list by inventory-fill. Apart from those read through his browser, no tool read the app. The Governor shows the list to the pastor and removes it on an objection. It holds no YouTube data, so the 30 days do not bind it."""

credit = "Brookfield First (Brookfield Assembly of God), Brookfield CT"
homepage = "https://subsplash.com/u/brookfieldfirst/media"
terms_url = "https://developers.google.com/youtube/terms/developer-policies"
added = 2026-11-09
on_by_default = false

# These are the sermons of one church, preached at Brookfield First, so a row
# that names no preacher is shown as the church's. Never written into a row's
# preacher.
by = "Brookfield First Assembly of God"
