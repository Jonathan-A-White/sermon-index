# Charles H. Spurgeon's "My Sermon Notes" in the Governor's Logos library, 264
# rows: one row a chapter of the two books (resources MYSRMNOTES01, Volumes 1 and 2,
# Genesis to Malachi, 129 chapters; and MYSRMNOTES03, Volumes 3 and 4, Matthew to
# Revelation, 135), made by
#
#   go run ./tools/logos-import --in <vault>/plans/sermons-2026-11-05/my-sermon-notes-volumes-1-2-genesis-to-malachi-sermons.jsonl --in <vault>/plans/sermons-2026-11-05/my-sermon-notes-volumes-3-4-matthew-to-revelation-sermons.jsonl --id spurgeon-sermon-notes-logos --out sources/spurgeon-sermon-notes-logos
#
# from the index file the Mayor made of each book on 2026-11-06 (the parser's
# book-archive form: no date, no series, the passages each chapter cites). The
# index keeps facts only: a title, the passage, the cited passages and the ref.ly
# address. No sentence of the book, and no Logos text, is written anywhere.
#
# What the tool counted (REPORT.md lists what it could not place):
#   264 lines read, 264 rows, none dropped. All 264 have a preaching text (the
#   `ref`, Logos's own reference); 185 cite further passages. A contents entry
#   "Chapter I: Gen. 19:15" is titled "Genesis 19:15" (the book's chapter is in
#   the notes: "Chapter I."). No row has a date.
# The link (https://ref.ly/logosres/LLS:<resource>?off=<offset>) opens the book at
# the sermon in Logos for an owner of the book and for no one else. It is
# UNVERIFIED: no one has tapped one yet (sermons check --urls was not run on it).


