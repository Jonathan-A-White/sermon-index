#
# from the index file the Mayor made of each book on 2026-11-06 (the parser's
# book-archive form). The index keeps facts only: a title, the passage, the cited
# passages and the ref.ly address. No sentence of a sermon, and no Logos text, is
# written anywhere.
#
# What the tool counted (REPORT.md lists what it could not place): 114 lines read, 113 rows, none dropped as unusable; the General Index of Volume 10
# is not a sermon and is dropped (REPORT.md). The preacher, and the preacher's years,
# are read from each title ("Basil (329–379): The Creation of the World"; Volume 2
# prints "The Heavenly Footman—Bunyan (1628–1688)"): the index names the editor,
# Grenville Kleiser, as the preacher of every line, so he is kept as the book's
# credit in each row's notes and is no one's preacher. The preacher is as the
# book prints him (a surname for most: "Hooker", "Edwards", "Wesley"). The index names no
# preaching text for any of the 113, so none has a `ref` (110 cite passages, which stay
# cited, none taken to be the text): they are found by title, preacher and source and
# by no verse.
# The link (https://ref.ly/logosres/LLS:<resource>?off=<offset>) opens the book at
# the sermon in Logos for an owner of the book and for no one else. It is
# UNVERIFIED: no one has tapped one yet (sermons check --urls was not run on it).


id = "worlds-great-sermons-logos"
