#
# from the index file the Mayor made of each volume on 2026-11-06 (the parser's
# book-archive form). The index keeps facts only: a title, the passage, the cited
# passages and the ref.ly address. No sentence of a sermon, and no Logos text, is
# written anywhere.
#
# What the tool counted (REPORT.md lists what it could not place): 491 lines read,
# 483 rows. Eight lines are not homilies and are dropped (the editor's prolegomena,
# the Arguments, the two Indexes of Texts, the Introductory Discourse; REPORT.md
# names each). The index names Philip Schaff, the editor, as the preacher of every
# line: --preacher sets John Chrysostom. 479 rows have a preaching text (the `ref`)
# and 338 cite further passages; 4 have none (REPORT.md). A title is only "Homily
# II" or "Chapter I" (Galatians): the passage and the row's id tell them apart.
# The link (https://ref.ly/logosres/LLS:<resource>?off=<offset>) opens the book at
# the sermon in Logos for an owner of the book and for no one else. It is
# UNVERIFIED: no one has tapped one yet (sermons check --urls was not run on it).


