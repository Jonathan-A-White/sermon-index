# John Calvin's Sermões sobre Eleição e Reprovação (SRMSSBRLRPRV), Calvin's thirteen sermons on
# Genesis 25 to 27 in Portuguese, in the Governor's Logos library, 13 rows, made by
#
#   go run ./tools/logos-import --in <vault>/plans/sermons-2026-11-05/serm-es-sobre-elei-o-e-reprova-o-sermons.jsonl --title-form "pt-ref" --id calvin-pt-logos --out sources/calvin-pt-logos
#
# from the index file the Mayor made of each book on 2026-11-06 (the parser's
# book-archive form). The index keeps facts only: a title, the passage, the cited
# passages and the ref.ly address. No sentence of a sermon, and no Logos text, is
# written anywhere.
#
# What the tool counted (REPORT.md lists what it could not place): 15 lines read, 13 rows, none dropped,
# 2 non-sermon lines left out: the "Prefácio" and the appendix "Resposta a Certas Calúnias e
# Blasfêmias" (a reply to slanders, not a sermon). The book is in PORTUGUESE and the titles are kept
# in Portuguese ("I. Primeiro Sermão: Gênesis 25.12–22"). --title-form pt-ref reads the passage
# after the colon (the Portuguese book name, a full stop between chapter and verse) as the
# preaching text: Genesis 25:12-22, and so for all 13; the verses Logos lists again for a text
# among its cited passages are left out of the cited ones. The format has no language field (the
# checker refuses an unknown key), so that the book is Portuguese is said here and in the name.
# The link (https://ref.ly/logosres/LLS:<resource>?off=<offset>) opens the book at
# the sermon in Logos for an owner of the book and for no one else. It is
# UNVERIFIED: no one has tapped one yet (sermons check --urls was not run on it).


